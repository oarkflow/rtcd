name: rtcd_chat
description: Client for rtcd's end-to-end encrypted chat (key directory, epochs, attachments) for Dart and Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cryptography: ^2.7.0
  http: ^1.2.0
  pointycastle: ^3.9.1
  web_socket_channel: ^3.0.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
